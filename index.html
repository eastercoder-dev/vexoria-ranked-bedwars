<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexoria Network</title>
<style>
:root{
  --bg:#090a0e;
  --panel:#0f1117;
  --panel2:#121722;
  --line:#232936;
  --text:#f7f8fb;
  --muted:#8a94a3;
  --muted2:#687386;
  --blue:#4287f5;
  --blue2:#6ecff6;
  --good:#67d58c;
  --red:#ff727c;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(520px 420px at 50% 11%,rgba(66,135,245,.08),transparent 68%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
.muted{color:var(--muted)}
.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;color:#788396}
.btn{height:42px;padding:0 15px;border:1px solid #2c3545;background:#10151d;color:#fff;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.btn:hover{border-color:#496a96}.btn.primary{background:var(--blue);border-color:var(--blue)}
.input,.select{width:100%;height:44px;border:1px solid #2b3444;background:#0d1118;color:#fff;padding:0 13px;outline:0}
.input:focus,.select:focus{border-color:var(--blue)}
.top{height:68px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;background:rgba(9,10,14,.92);backdrop-filter:blur(14px)}
.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:1000;letter-spacing:.08em}
.mark{width:32px;height:32px;border:1px solid #34465d;display:grid;place-items:center;background:#0e141d;font-weight:1000}
.gnav{display:flex;gap:2px;align-items:center}
.gnav button{border:0;background:transparent;color:#7e8999;padding:10px 11px;font-size:10px;font-weight:900}
.gnav button.active,.gnav button:hover{color:#fff;background:#111720}
.modebar{border-bottom:1px solid var(--line);background:#0a0c11}
.modebar .wrap{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.modebrand{font-size:10px;font-weight:1000;letter-spacing:.09em}.modebrand b{color:var(--blue2)}
.tabs{display:flex;gap:2px;overflow:auto}
.tabs button{border:0;background:transparent;color:#788394;padding:18px 11px;font-size:10px;font-weight:900;white-space:nowrap}
.tabs button.active,.tabs button:hover{color:#fff;background:#111720}

/* Skyline-style centered hero */
.hero{padding:88px 0 68px;border-bottom:1px solid var(--line)}
.hero-inner{text-align:center;max-width:880px;margin:auto}
.hero .live{display:inline-flex;align-items:center;gap:8px;border:1px solid #2b3545;background:#0e131b;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.hero h1{font-size:clamp(64px,9vw,116px);line-height:.82;letter-spacing:-.08em;margin:22px 0 22px;text-transform:uppercase}
.hero h1 span{display:block;color:var(--blue)}
.hero p{max-width:690px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.7}
.hero-stats{display:flex;justify-content:center;gap:52px;flex-wrap:wrap;margin-top:32px}
.hero-stat{min-width:120px}
.hero-stat label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#6c788a;font-weight:900}
.hero-stat strong{display:block;margin-top:8px;font-size:18px}
.logo-stage{margin:58px auto 0;width:min(520px,100%);height:250px;display:grid;place-items:center;position:relative}
.logo-stage:before,.logo-stage:after{content:"";position:absolute;border:1px solid rgba(110,207,246,.11);border-radius:50%}
.logo-stage:before{width:240px;height:240px}.logo-stage:after{width:165px;height:165px}
.logo-stage .v{font-size:118px;font-weight:1000;letter-spacing:-.08em;position:relative;z-index:2}

.section{padding:72px 0}
.section-title{text-align:center;max-width:800px;margin:0 auto 30px}
.section-title h2{font-size:42px;letter-spacing:-.05em;margin:8px 0 10px}
.section-title p{color:var(--muted);line-height:1.65;margin:0}
.server-card{border:1px solid var(--line);background:#0b0f15;display:grid;grid-template-columns:1.45fr repeat(4,.75fr)}
.server-card>div{padding:20px 21px;border-right:1px solid var(--line)}
.server-card>div:last-child{border-right:0}
.server-card .main h3{font-size:20px;margin:6px 0}.server-card label{display:block;font-size:9px;letter-spacing:.13em;color:#6f7a8b;font-weight:900}
.server-card strong{display:block;margin-top:8px;font-size:13px}
.ipline{margin-top:14px;border:1px solid var(--line);background:#0b0f15;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.feature-list{border:1px solid var(--line);background:var(--line);display:grid;gap:1px}
.feature{background:#0b0f15;padding:24px 26px;display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:18px}
.feature:hover{background:#101620}
.feature .num{font-size:10px;color:#687488;font-weight:900;letter-spacing:.15em}
.feature h3{margin:0;font-size:22px}.feature p{margin:7px 0 0;color:var(--muted);font-size:12px}.feature .arr{font-size:21px;color:var(--blue2)}
.pagehead{text-align:center;max-width:820px;margin:0 auto 34px}
.pagehead h1{font-size:52px;letter-spacing:-.06em;margin:7px 0 10px}
.pagehead p{color:var(--muted);line-height:1.65;margin:0}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
.field label{display:block;font-size:9px;letter-spacing:.13em;color:#6e798b;font-weight:900;text-transform:uppercase;margin-bottom:7px}
.empty{border:1px dashed #2b3443;background:#0a0d12;padding:52px 24px;text-align:center;color:#707b8c}
.board{border:1px solid var(--line);background:#0a0e13;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{height:47px;text-align:left;padding:0 15px;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.14em;color:#6e798b;text-transform:uppercase}
td{height:66px;padding:0 15px;border-bottom:1px solid #171d26;font-size:13px}
tbody tr:hover{background:#0f141d}
.head{width:31px;height:31px;image-rendering:pixelated;border:1px solid #2c3748}
.pcell{font-weight:900;cursor:pointer}.pcell:hover{color:var(--blue2)}
.rank{font-weight:1000;color:#aab6c5}
.report-head{display:grid;grid-template-columns:88px 1fr auto;gap:22px;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line)}
.report-head img{width:88px;height:88px;image-rendering:pixelated;border:1px solid #2d394a}
.report-head h2{font-size:36px;margin:2px 0}.report-score{text-align:right}.report-score strong{font-size:34px;display:block}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.stat{background:#0b0f15;padding:18px}.stat label{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#6f7b8c;font-weight:900}.stat strong{display:block;font-size:24px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panel{border:1px solid var(--line);background:#0b0f15;padding:20px}.panel h3{margin:6px 0 13px}
.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-top:1px solid #161c25;font-size:12px}
.compare-card{border:1px solid var(--line);background:#0a0e13;padding:24px}
.compare-inputs,.team-inputs{display:grid;grid-template-columns:1fr 74px 1fr;gap:10px;align-items:end}.vs{text-align:center;padding-bottom:13px;color:#667184;font-size:11px;font-weight:1000}
.compare-result{margin-top:18px;border:1px solid var(--line);background:#0a0e13}
.people{display:grid;grid-template-columns:1fr 1fr}.person{padding:22px}.person+.person{border-left:1px solid var(--line)}
.personline{display:flex;align-items:center;gap:12px}.personline img{width:52px;height:52px;image-rendering:pixelated}
.crow{display:grid;grid-template-columns:1fr 170px 1fr;gap:10px;padding:12px 22px;border-top:1px solid #171d26;text-align:center}.crow .metric{font-size:9px;letter-spacing:.12em;color:#6d798b;text-transform:uppercase}.lead{color:var(--blue2);font-weight:900}
.team-lab{margin-top:44px;padding-top:36px;border-top:1px solid var(--line)}
.archive-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}.archive-metrics>div{background:#0b0f15;padding:15px}.archive-metrics label{font-size:9px;color:#6e798b;letter-spacing:.11em}.archive-metrics strong{display:block;margin-top:6px}
.match{border:1px solid var(--line);background:#0a0e13;padding:18px;margin-bottom:10px}.match-top{display:flex;justify-content:space-between;color:#7b8798;font-size:11px;margin-bottom:11px}.teamrow{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #171d26;padding:10px 0}.teamrow.win{color:#a0e2ae}
.rule-tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px 0 28px}.rule-tabs button{height:40px;border:1px solid #2b3545;background:#0b1017;color:#8490a2;padding:0 13px;font-size:10px;font-weight:900}.rule-tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.rule-page{display:none}.rule-page.active{display:block}.season-card{text-align:center;border:1px solid var(--line);background:#0a0e13;padding:30px}.season-card h2{font-size:46px;margin:8px 0}.item-group{margin:28px 0}.item-group h3{text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.item-group .desc{text-align:center;color:var(--muted);margin-bottom:12px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.item{height:86px;border:1px solid #2c3545;background:#0b1016;display:grid;place-items:center;text-align:center;font-size:9px}.item b{display:block;font-size:24px}
.minemen{padding:54px 0}.minihead{display:flex;justify-content:space-between;align-items:center;gap:28px;margin-bottom:26px}.minihead h1{font-size:44px;letter-spacing:-.05em;margin:0}.mini-search{display:flex;gap:8px;max-width:360px;width:100%}
.category-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}.category-tabs button{height:42px;border:0;background:transparent;color:#7f8999;font-size:11px;font-weight:900;border-bottom:2px solid transparent}.category-tabs button.active{color:#fff;border-bottom-color:var(--blue)}
.mode-pills{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.mode-pills button{height:37px;border:1px solid #293243;background:#0c1117;color:#8994a5;padding:0 12px;font-size:10px;font-weight:900;white-space:nowrap}.mode-pills button.active{background:#172235;border-color:#36557e;color:#fff}
.profile-card{border:1px solid var(--line);background:#0b0f15;padding:25px}.profile-main{display:grid;grid-template-columns:78px 1fr auto;gap:20px;align-items:center}.profile-main img{width:78px;height:78px;image-rendering:pixelated}.profile-main h2{font-size:31px;margin:0}.profile-score{text-align:right}.profile-score strong{display:block;font-size:31px}
.profile-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}.profile-summary>div{background:#0c1118;padding:18px}
.more{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
footer{border-top:1px solid var(--line);padding:28px 0;color:#6f7a8c;font-size:11px}.footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:900px){.server-card{grid-template-columns:1fr 1fr}.server-card .main{grid-column:1/-1}.stat-grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.compare-inputs,.team-inputs{grid-template-columns:1fr}.vs{padding:0}.archive-metrics{grid-template-columns:1fr 1fr}.gnav{display:none}.modebar .wrap{align-items:flex-start;flex-direction:column;padding:10px 0}.tabs{width:100%}.controls{grid-template-columns:1fr}.profile-main,.report-head{grid-template-columns:70px 1fr}.profile-score,.report-score{grid-column:1/-1;text-align:left}}
@media(max-width:560px){.wrap{width:min(var(--max),calc(100% - 24px))}.hero h1{font-size:58px}.hero-stats{gap:24px}.server-card{grid-template-columns:1fr}.server-card>div{border-right:0;border-bottom:1px solid var(--line)}.feature{grid-template-columns:52px 1fr}.feature .arr{display:none}.stat-grid{grid-template-columns:1fr}.crow{grid-template-columns:1fr 100px 1fr}.archive-metrics{grid-template-columns:1fr}.profile-summary{grid-template-columns:1fr}}

/* === FLOATING / COLORED SKYLINE-STYLE PASS === */
body::before{
  content:"";position:fixed;inset:68px 0 auto 0;height:760px;z-index:-2;
  background:
    linear-gradient(180deg,rgba(4,7,12,.32) 0%,rgba(7,9,13,.62) 56%,#090a0e 100%),
    url('vexoria-castle-bg.jpg') center top/cover no-repeat;
  opacity:.88;pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:68px 0 auto 0;height:760px;z-index:-1;
  background:radial-gradient(circle at 50% 28%,rgba(66,135,245,.12),transparent 38%);
  pointer-events:none;
}
.hero{background:transparent!important}
.hero-inner{position:relative}
.logo-stage{filter:drop-shadow(0 14px 42px rgba(0,0,0,.42))}
.server-card{
  position:relative;
  transform:translateY(-14px);
  border:1px solid rgba(77,115,168,.62)!important;
  background:linear-gradient(145deg,rgba(12,18,28,.90),rgba(8,12,19,.84))!important;
  box-shadow:0 24px 68px rgba(0,0,0,.40),0 0 0 1px rgba(66,135,245,.04) inset;
}
.server-card::before{
  content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,#4287f5,#6ecff6,transparent);opacity:.78
}
.ipline{
  width:min(920px,94%);margin:18px auto 0!important;position:relative;transform:translateY(-6px);
  border:1px solid rgba(64,160,214,.48)!important;
  background:linear-gradient(135deg,rgba(10,20,30,.94),rgba(8,13,20,.92))!important;
  box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 30px rgba(110,207,246,.035);
}
.ipline::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(110,207,246,.25),transparent 24%,transparent 76%,rgba(66,135,245,.22));
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px
}
.feature-list{background:transparent!important;border:0!important;gap:12px!important;grid-template-columns:repeat(3,1fr)!important}
.feature{
  min-height:168px;border:1px solid var(--line);padding:25px!important;grid-template-columns:58px 1fr auto!important;
  background:linear-gradient(145deg,rgba(11,15,21,.94),rgba(8,12,18,.94))!important;
  box-shadow:0 18px 55px rgba(0,0,0,.28);transform:translateY(0);transition:.18s ease!important
}
.feature:nth-child(1){border-color:rgba(66,135,245,.62)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(66,135,245,.045)}
.feature:nth-child(2){border-color:rgba(74,204,202,.56)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(74,204,202,.04)}
.feature:nth-child(3){border-color:rgba(164,111,255,.58)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(164,111,255,.04)}
.feature:nth-child(1) .num,.feature:nth-child(1) .arr{color:#4287f5!important}
.feature:nth-child(2) .num,.feature:nth-child(2) .arr{color:#57d5cf!important}
.feature:nth-child(3) .num,.feature:nth-child(3) .arr{color:#b07cff!important}
.feature:hover{transform:translateY(-6px)!important}
.feature h3{font-size:20px!important}
.section-title{margin-top:18px!important}
.pagehead{position:relative}
.pagehead::after{
  content:"";display:block;width:54px;height:2px;margin:18px auto 0;
  background:linear-gradient(90deg,var(--blue),var(--blue2))
}
.stat-grid{box-shadow:0 18px 54px rgba(0,0,0,.22)}
.panel,.board,.compare-card,.compare-result,.season-card,.match{
  box-shadow:0 15px 45px rgba(0,0,0,.20)
}
.minemen .board{border-color:rgba(66,135,245,.20)}
@media(max-width:900px){.feature-list{grid-template-columns:1fr!important}.server-card{transform:none}.ipline{width:100%;transform:none}}

</style>
</head>
<body>
<header class="top">
<div class="wrap">
  <div class="brand" onclick="go('#home')" style="cursor:pointer"><div class="mark">V</div>VEXORIA NETWORK</div>
  <nav class="gnav">
    <button data-r="home" onclick="go('#home')">Home</button>
    <button data-r="rbw" onclick="go('#rbw-home')">Ranked BedWars</button>
    <button data-r="duels" onclick="go('#duels')">Duels</button>
    <button data-r="kitpvp" onclick="go('#kitpvp')">KitPvP</button>
    <button onclick="window.open('https://discord.gg/vexorianetwork','_blank')">Discord ↗</button>
  </nav>
  <button class="btn" onclick="copyIP()">Copy IP</button>
</div>
</header>

<main id="app"></main>

<footer><div class="wrap footer"><div>© 2026 Vexoria Network</div><div>mc.vexoriannetwork.club · discord.gg/vexorianetwork</div></div></footer>

<script>
const IP='mc.vexoriannetwork.club';
const API={
 network:'/api/network',
 rbwPlayer:u=>`/api/player?username=${encodeURIComponent(u)}`,
 rbwSeasons:'/api/rbw/seasons',
 rbwLeaderboard:(stat='elo',season='',username='')=>`/api/rbw/leaderboard?stat=${encodeURIComponent(stat)}${season?`&season=${encodeURIComponent(season)}`:''}${username?`&username=${encodeURIComponent(username)}`:''}`,
 rbwMatches:(username='',season='',page=1)=>`/api/rbw/matches?page=${page}${username?`&username=${encodeURIComponent(username)}`:''}${season?`&season=${encodeURIComponent(season)}`:''}`,
 rbwAnalytics:(action,p='',p2='')=>`/api/rbw/analytics?action=${encodeURIComponent(action)}${p?`&player=${encodeURIComponent(p)}`:''}${p2?`&player2=${encodeURIComponent(p2)}`:''}`,
 duelsPlayer:u=>`/api/duels/player?username=${encodeURIComponent(u)}`,
 duelsCasual:u=>`/api/duels/casual?username=${encodeURIComponent(u)}`,
 duelsLeaderboard:(mode='BEDFIGHT',stat='elo')=>`/api/duels/leaderboard?mode=${encodeURIComponent(mode)}&stat=${encodeURIComponent(stat)}`,
 kpPlayer:u=>`/api/kitpvp/player?username=${encodeURIComponent(u)}`,
 kpLeaderboard:stat=>`/api/kitpvp/leaderboard?stat=${encodeURIComponent(stat)}`,
 kpKills:u=>`/api/kitpvp/kills${u?`?username=${encodeURIComponent(u)}`:''}`,
 kpKits:u=>`/api/kitpvp/kits?username=${encodeURIComponent(u)}`
};
const $=q=>document.querySelector(q), app=()=>$('#app');
function go(h){location.hash=h}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function n(v){return Number(v||0).toLocaleString()}
function pct(v){return `${Number(v||0).toFixed(1)}%`}
function head(u,s=31){return `https://mc-heads.net/avatar/${encodeURIComponent(u)}/${s}`}
async function get(url){const r=await fetch(url);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function copyIP(){navigator.clipboard?.writeText(IP);alert('Copied: '+IP)}
function active(r){document.querySelectorAll('.gnav button[data-r]').forEach(b=>b.classList.toggle('active',b.dataset.r===r))}
function stat(l,v){return `<div class="stat"><label>${l}</label><strong>${v}</strong></div>`}
function row(a,b){return `<div class="row"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`}
function rbwNav(a){const t=[['home','Home'],['stats','Stats'],['rankings','Leaderboards'],['compare','Compare'],['matches','Recaps'],['rules','Rules']];return `<div class="modebar"><div class="wrap"><div class="modebrand"><b>VEXORIA</b> RANKED BEDWARS · GLOBAL</div><div class="tabs">${t.map(([id,l])=>`<button class="${id===a?'active':''}" onclick="go('#rbw-${id}')">${l}</button>`).join('')}</div></div></div>`}
function feat(no,t,d,h){return `<div class="feature" onclick="go('${h}')"><div class="num">${no}</div><div><h3>${t}</h3><p>${d}</p></div><div class="arr">↗</div></div>`}

function renderHome(){
 active('home');
 app().innerHTML=`<section class="hero"><div class="wrap"><div class="hero-inner">
 <div class="live"><span class="dot"></span>NETWORK ONLINE</div>
 <h1>VEXORIA <span>NETWORK</span></h1>
 <p>A modern Minecraft network built around competitive BedWars, modern 1.21 duels and persistent KitPvP progression.</p>
 <div class="hero-stats"><div class="hero-stat"><label>VERSION</label><strong>1.21.x</strong></div><div class="hero-stat"><label>LOCATION</label><strong>SINGAPORE</strong></div><div class="hero-stat"><label>ONLINE PLAYERS</label><strong id="home-online">—</strong></div><div class="hero-stat"><label>SERVER IP</label><strong>${IP}</strong></div></div>
 <div class="logo-stage"><div class="v">V</div></div>

function pretty(m){return ({BEDFIGHT:'Bed Fight',FIREBALL_FIGHT:'Fireball Fight',FIREBALL_MACE:'Fireball Mace',SKYFIGHT:'Sky Fight',BATTLERUSH:'Battle Rush',BRIDGE:'Bridge'})[m]||m}
function setDMode(m,b){dmode=m;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));loadDuelLB()}
async function loadDuelLB(){const out=$('#dboard');try{const d=await get(API.duelsLeaderboard(dmode,'elo')),rows=d.players||[];out.className='board';out.innerHTML=`<table><thead><tr><th>#</th><th></th><th>PLAYER</th><th>WIN RATE</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="rank">${x.position}</td><td><img class="head" src="${head(x.username)}"></td><td><div class="pcell" onclick="go('#duels-player/${encodeURIComponent(x.username)}')">${esc(x.username)}</div></td><td>${pct(x.winRate||0)}</td></tr>`).join('')}</tbody></table>`}catch(e){out.className='empty';out.textContent=e.message}}
function openDuelSearch(){const q=$('#dq').value.trim();if(q)go('#duels-player/'+encodeURIComponent(q))}
async function renderDuelPlayer(u){active('duels');app().innerHTML=`<section class="minemen"><div class="wrap"><div id="dp" class="empty">Loading player…</div></div></section>`;const out=$('#dp');try{const [x,c]=await Promise.all([get(API.duelsPlayer(u)),get(API.duelsCasual(u)).catch(()=>null)]);out.className='';out.innerHTML=`<div class="profile-card"><div class="profile-main"><img src="${head(x.username,78)}"><div><div class="kicker">VEXORIA DUELS</div><h2>${esc(x.username)}</h2><div class="muted">Modern 1.21 Practice</div></div><div class="profile-score"><div class="kicker">GLOBAL ELO</div><strong>${n(x.globalElo)}</strong></div></div><div class="profile-summary"><div><div class="kicker">RANKED GAMES</div><strong>${n(x.rankedTotals?.games||0)}</strong></div><div><div class="kicker">RANKED WIN RATE</div><strong>${pct(x.rankedTotals?.winRate||0)}</strong></div><div><div class="kicker">CASUAL KILLS</div><strong>${n(c?.kills||0)}</strong></div></div><div class="more"><button class="btn primary" onclick="go('#duels-detail/${encodeURIComponent(x.username)}')">View More →</button></div></div>`}catch(e){out.className='empty';out.textContent=e.message}}
async function renderDuelDetail(u){active('duels');app().innerHTML=`<section class="minemen"><div class="wrap"><div id="dd" class="empty">Loading complete profile…</div></div></section>`;const out=$('#dd');try{const [x,c]=await Promise.all([get(API.duelsPlayer(u)),get(API.duelsCasual(u)).catch(()=>null)]);out.className='';out.innerHTML=`<div class="profile-card"><div class="profile-main"><img src="${head(x.username,78)}"><div><div class="kicker">MODERN PRACTICE PROFILE</div><h2>${esc(x.username)}</h2><div class="muted">Detailed competitive record</div></div><div class="profile-score"><div class="kicker">GLOBAL ELO</div><strong>${n(x.globalElo)}</strong><div class="muted">Peak ${n(x.peakGlobalElo)}</div></div></div></div><div class="pagehead" style="margin-top:50px"><div class="kicker">CASUAL</div><h1>Practice Record</h1></div><div class="stat-grid">${stat('CASUAL KILLS',n(c?.kills||0))}</div><div class="pagehead" style="margin-top:50px"><div class="kicker">COMPETITIVE</div><h1>Ranked Modes</h1></div><div class="board"><table><thead><tr><th>MODE</th><th>ELO</th><th>PEAK</th><th>WINS</th><th>LOSSES</th><th>WIN RATE</th><th>KILLS</th><th>STREAK</th></tr></thead><tbody>${(x.rankedModes||[]).map(m=>`<tr><td><strong>${pretty(m.mode)}</strong></td><td>${n(m.elo)}</td><td>${n(m.peakElo)}</td><td>${n(m.wins)}</td><td>${n(m.losses)}</td><td>${pct(m.winRate)}</td><td>${n(m.kills)}</td><td>${n(m.currentWinStreak)} / ${n(m.bestWinStreak)}</td></tr>`).join('')}</tbody></table></div>`}catch(e){out.className='empty';out.textContent=e.message}}

function renderKP(){active('kitpvp');app().innerHTML=`<section class="minemen"><div class="wrap"><div class="minihead"><div><div class="kicker">KITPVP 1.21X</div><h1>Leaderboards</h1></div><div class="mini-search"><input id="kq" class="input" placeholder="Search player..."><button class="btn" onclick="openKPSearch()">Open</button></div></div><div class="category-tabs"><button class="active">KitPvP</button></div><div class="controls" style="grid-template-columns:320px"><div class="field"><label>RANK BY</label><select id="kst" class="select" onchange="loadKPLB()"><option value="coins">Coins</option><option value="kills">Kills</option><option value="experience">Experience</option><option value="streak">Best Killstreak</option></select></div></div><div id="kb" class="empty">Loading leaderboard…</div></div></section>`;setTimeout(loadKPLB,0)}
async function loadKPLB(){const out=$('#kb');try{const d=await get(API.kpLeaderboard($('#kst')?.value||'coins')),rows=d.players||[];out.className='board';out.innerHTML=`<table><thead><tr><th>#</th><th></th><th>PLAYER</th><th>COINS</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="rank">${x.position}</td><td><img class="head" src="${head(x.username)}"></td><td><div class="pcell" onclick="go('#kitpvp-player/${encodeURIComponent(x.username)}')">${esc(x.username)}</div></td><td>${n(x.coins)}</td></tr>`).join('')}</tbody></table>`}catch(e){out.className='empty';out.textContent=e.message}}
function openKPSearch(){const q=$('#kq').value.trim();if(q)go('#kitpvp-player/'+encodeURIComponent(q))}
async function renderKPPlayer(u){active('kitpvp');app().innerHTML=`<section class="minemen"><div class="wrap"><div id="kp" class="empty">Loading player…</div></div></section>`;const out=$('#kp');try{const [x,k,h]=await Promise.all([get(API.kpPlayer(u)),get(API.kpKits(u)).catch(()=>({ownedKits:[]})),get(API.kpKills(u)).catch(()=>({kills:[]}))]);const kd=x.deaths?x.kills/x.deaths:x.kills;out.className='';out.innerHTML=`<div class="profile-card"><div class="profile-main"><img src="${head(x.username,78)}"><div><div class="kicker">VEXORIA KITPVP</div><h2>${esc(x.username)}</h2><div class="muted">${esc(x.selectedKit||'No selected kit')}</div></div><div class="profile-score"><div class="kicker">COINS</div><strong>${n(x.coins)}</strong></div></div><div class="profile-summary"><div><div class="kicker">KILLS</div><strong>${n(x.kills)}</strong></div><div><div class="kicker">K/D</div><strong>${Number(kd).toFixed(2)}</strong></div><div><div class="kicker">BEST STREAK</div><strong>${n(x.bestKillstreak)}</strong></div></div></div><div class="pagehead" style="margin-top:50px"><div class="kicker">COMPLETE PROFILE</div><h1>KitPvP Record</h1></div><div class="stat-grid">${stat('COINS',n(x.coins))}${stat('KILLS',n(x.kills))}${stat('DEATHS',n(x.deaths))}${stat('K/D',Number(kd).toFixed(2))}${stat('EXPERIENCE',n(x.experience))}${stat('CURRENT STREAK',n(x.currentKillstreak))}${stat('BEST STREAK',n(x.bestKillstreak))}${stat('OWNED KITS',n(k.ownedKitCount||k.ownedKits?.length||0))}</div><div class="two"><div class="panel"><div class="kicker">OWNED KITS</div><h3>${n(k.ownedKitCount||k.ownedKits?.length||0)} unlocked</h3>${(k.ownedKits||[]).slice(0,30).map(z=>`<span class="live" style="margin:3px">${esc(z)}</span>`).join('')||'<div class="muted">No kit data.</div>'}</div><div class="panel"><div class="kicker">RECENT KILLS</div><h3>Combat activity</h3>${(h.kills||[]).slice(0,8).map(z=>row(`${z.killer?.username||x.username} → ${z.victim?.username||'Unknown'}`,z.kit||'KitPvP')).join('')||'<div class="muted">No recent kill history.</div>'}</div></div>`}catch(e){out.className='empty';out.textContent=e.message}}

function router(){const h=(location.hash||'#home').slice(1);if(h==='home')return renderHome();if(h==='rbw-home')return renderRBWHome();if(h==='rbw-stats')return renderStats();if(h==='rbw-rankings')return renderRankings();if(h==='rbw-compare')return renderCompare();if(h==='rbw-matches')return renderMatches();if(h==='rbw-rules')return renderRules();if(h==='duels')return renderDuels();if(h.startsWith('duels-player/'))return renderDuelPlayer(decodeURIComponent(h.slice(13)));if(h.startsWith('duels-detail/'))return renderDuelDetail(decodeURIComponent(h.slice(13)));if(h==='kitpvp')return renderKP();if(h.startsWith('kitpvp-player/'))return renderKPPlayer(decodeURIComponent(h.slice(14)));return renderHome()}
addEventListener('hashchange',router);router();
</script>
</body>
</html>
