<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexoria Network</title>
<style>
:root{
  --bg:#090a0e;
  --panel:#0f1117;
  --panel2:#121722;
  --line:#232936;
  --text:#f7f8fb;
  --muted:#8a94a3;
  --muted2:#687386;
  --blue:#4287f5;
  --blue2:#6ecff6;
  --good:#67d58c;
  --red:#ff727c;
  --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(520px 420px at 50% 11%,rgba(66,135,245,.08),transparent 68%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
.muted{color:var(--muted)}
.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;color:#788396}
.btn{height:42px;padding:0 15px;border:1px solid #2c3545;background:#10151d;color:#fff;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.btn:hover{border-color:#496a96}.btn.primary{background:var(--blue);border-color:var(--blue)}
.input,.select{width:100%;height:44px;border:1px solid #2b3444;background:#0d1118;color:#fff;padding:0 13px;outline:0}
.input:focus,.select:focus{border-color:var(--blue)}
.top{height:68px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;background:rgba(9,10,14,.92);backdrop-filter:blur(14px)}
.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:1000;letter-spacing:.08em}
.mark{width:32px;height:32px;border:1px solid #34465d;display:grid;place-items:center;background:#0e141d;font-weight:1000}
.gnav{display:flex;gap:2px;align-items:center}
.gnav button{border:0;background:transparent;color:#7e8999;padding:10px 11px;font-size:10px;font-weight:900}
.gnav button.active,.gnav button:hover{color:#fff;background:#111720}
.modebar{border-bottom:1px solid var(--line);background:#0a0c11}
.modebar .wrap{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.modebrand{font-size:10px;font-weight:1000;letter-spacing:.09em}.modebrand b{color:var(--blue2)}
.tabs{display:flex;gap:2px;overflow:auto}
.tabs button{border:0;background:transparent;color:#788394;padding:18px 11px;font-size:10px;font-weight:900;white-space:nowrap}
.tabs button.active,.tabs button:hover{color:#fff;background:#111720}

/* Skyline-style centered hero */
.hero{padding:88px 0 68px;border-bottom:1px solid var(--line)}
.hero-inner{text-align:center;max-width:880px;margin:auto}
.hero .live{display:inline-flex;align-items:center;gap:8px;border:1px solid #2b3545;background:#0e131b;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.hero h1{font-size:clamp(64px,9vw,116px);line-height:.82;letter-spacing:-.08em;margin:22px 0 22px;text-transform:uppercase}
.hero h1 span{display:block;color:var(--blue)}
.hero p{max-width:690px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.7}
.hero-stats{display:flex;justify-content:center;gap:52px;flex-wrap:wrap;margin-top:32px}
.hero-stat{min-width:120px}
.hero-stat label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#6c788a;font-weight:900}
.hero-stat strong{display:block;margin-top:8px;font-size:18px}
.logo-stage{margin:58px auto 0;width:min(520px,100%);height:250px;display:grid;place-items:center;position:relative}
.logo-stage:before,.logo-stage:after{content:"";position:absolute;border:1px solid rgba(110,207,246,.11);border-radius:50%}
.logo-stage:before{width:240px;height:240px}.logo-stage:after{width:165px;height:165px}
.logo-stage .v{font-size:118px;font-weight:1000;letter-spacing:-.08em;position:relative;z-index:2}

.section{padding:72px 0}
.section-title{text-align:center;max-width:800px;margin:0 auto 30px}
.section-title h2{font-size:42px;letter-spacing:-.05em;margin:8px 0 10px}
.section-title p{color:var(--muted);line-height:1.65;margin:0}
.server-card{border:1px solid var(--line);background:#0b0f15;display:grid;grid-template-columns:1.45fr repeat(4,.75fr)}
.server-card>div{padding:20px 21px;border-right:1px solid var(--line)}
.server-card>div:last-child{border-right:0}
.server-card .main h3{font-size:20px;margin:6px 0}.server-card label{display:block;font-size:9px;letter-spacing:.13em;color:#6f7a8b;font-weight:900}
.server-card strong{display:block;margin-top:8px;font-size:13px}
.ipline{margin-top:14px;border:1px solid var(--line);background:#0b0f15;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.feature-list{border:1px solid var(--line);background:var(--line);display:grid;gap:1px}
.feature{background:#0b0f15;padding:24px 26px;display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:18px}
.feature:hover{background:#101620}
.feature .num{font-size:10px;color:#687488;font-weight:900;letter-spacing:.15em}
.feature h3{margin:0;font-size:22px}.feature p{margin:7px 0 0;color:var(--muted);font-size:12px}.feature .arr{font-size:21px;color:var(--blue2)}
.pagehead{text-align:center;max-width:820px;margin:0 auto 34px}
.pagehead h1{font-size:52px;letter-spacing:-.06em;margin:7px 0 10px}
.pagehead p{color:var(--muted);line-height:1.65;margin:0}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
.field label{display:block;font-size:9px;letter-spacing:.13em;color:#6e798b;font-weight:900;text-transform:uppercase;margin-bottom:7px}
.empty{border:1px dashed #2b3443;background:#0a0d12;padding:52px 24px;text-align:center;color:#707b8c}
.board{border:1px solid var(--line);background:#0a0e13;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{height:47px;text-align:left;padding:0 15px;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.14em;color:#6e798b;text-transform:uppercase}
td{height:66px;padding:0 15px;border-bottom:1px solid #171d26;font-size:13px}
tbody tr:hover{background:#0f141d}
.head{width:31px;height:31px;image-rendering:pixelated;border:1px solid #2c3748}
.pcell{font-weight:900;cursor:pointer}.pcell:hover{color:var(--blue2)}
.rank{font-weight:1000;color:#aab6c5}
.report-head{display:grid;grid-template-columns:88px 1fr auto;gap:22px;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line)}
.report-head img{width:88px;height:88px;image-rendering:pixelated;border:1px solid #2d394a}
.report-head h2{font-size:36px;margin:2px 0}.report-score{text-align:right}.report-score strong{font-size:34px;display:block}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.stat{background:#0b0f15;padding:18px}.stat label{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#6f7b8c;font-weight:900}.stat strong{display:block;font-size:24px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panel{border:1px solid var(--line);background:#0b0f15;padding:20px}.panel h3{margin:6px 0 13px}
.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-top:1px solid #161c25;font-size:12px}
.compare-card{border:1px solid var(--line);background:#0a0e13;padding:24px}
.compare-inputs,.team-inputs{display:grid;grid-template-columns:1fr 74px 1fr;gap:10px;align-items:end}.vs{text-align:center;padding-bottom:13px;color:#667184;font-size:11px;font-weight:1000}
.compare-result{margin-top:18px;border:1px solid var(--line);background:#0a0e13}
.people{display:grid;grid-template-columns:1fr 1fr}.person{padding:22px}.person+.person{border-left:1px solid var(--line)}
.personline{display:flex;align-items:center;gap:12px}.personline img{width:52px;height:52px;image-rendering:pixelated}
.crow{display:grid;grid-template-columns:1fr 170px 1fr;gap:10px;padding:12px 22px;border-top:1px solid #171d26;text-align:center}.crow .metric{font-size:9px;letter-spacing:.12em;color:#6d798b;text-transform:uppercase}.lead{color:var(--blue2);font-weight:900}
.team-lab{margin-top:44px;padding-top:36px;border-top:1px solid var(--line)}
.archive-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}.archive-metrics>div{background:#0b0f15;padding:15px}.archive-metrics label{font-size:9px;color:#6e798b;letter-spacing:.11em}.archive-metrics strong{display:block;margin-top:6px}
.match{border:1px solid var(--line);background:#0a0e13;padding:18px;margin-bottom:10px}.match-top{display:flex;justify-content:space-between;color:#7b8798;font-size:11px;margin-bottom:11px}.teamrow{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #171d26;padding:10px 0}.teamrow.win{color:#a0e2ae}
.rule-tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px 0 28px}.rule-tabs button{height:40px;border:1px solid #2b3545;background:#0b1017;color:#8490a2;padding:0 13px;font-size:10px;font-weight:900}.rule-tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.rule-page{display:none}.rule-page.active{display:block}.season-card{text-align:center;border:1px solid var(--line);background:#0a0e13;padding:30px}.season-card h2{font-size:46px;margin:8px 0}.item-group{margin:28px 0}.item-group h3{text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.item-group .desc{text-align:center;color:var(--muted);margin-bottom:12px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.item{height:86px;border:1px solid #2c3545;background:#0b1016;display:grid;place-items:center;text-align:center;font-size:9px}.item b{display:block;font-size:24px}.item img{width:32px;height:32px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.minemen{padding:54px 0}.minihead{display:flex;justify-content:space-between;align-items:center;gap:28px;margin-bottom:26px}.minihead h1{font-size:44px;letter-spacing:-.05em;margin:0}.mini-search{display:flex;gap:8px;max-width:360px;width:100%}
.category-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}.category-tabs button{height:42px;border:0;background:transparent;color:#7f8999;font-size:11px;font-weight:900;border-bottom:2px solid transparent}.category-tabs button.active{color:#fff;border-bottom-color:var(--blue)}
.mode-pills{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.mode-pills button{height:37px;border:1px solid #293243;background:#0c1117;color:#8994a5;padding:0 12px;font-size:10px;font-weight:900;white-space:nowrap}.mode-pills button.active{background:#172235;border-color:#36557e;color:#fff}
.profile-card{border:1px solid var(--line);background:#0b0f15;padding:25px}.profile-main{display:grid;grid-template-columns:78px 1fr auto;gap:20px;align-items:center}.profile-main img{width:78px;height:78px;image-rendering:pixelated}.profile-main h2{font-size:31px;margin:0}.profile-score{text-align:right}.profile-score strong{display:block;font-size:31px}
.profile-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}.profile-summary>div{background:#0c1118;padding:18px}
.more{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
footer{border-top:1px solid var(--line);padding:28px 0;color:#6f7a8c;font-size:11px}.footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:900px){.server-card{grid-template-columns:1fr 1fr}.server-card .main{grid-column:1/-1}.stat-grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.compare-inputs,.team-inputs{grid-template-columns:1fr}.vs{padding:0}.archive-metrics{grid-template-columns:1fr 1fr}.gnav{display:none}.modebar .wrap{align-items:flex-start;flex-direction:column;padding:10px 0}.tabs{width:100%}.controls{grid-template-columns:1fr}.profile-main,.report-head{grid-template-columns:70px 1fr}.profile-score,.report-score{grid-column:1/-1;text-align:left}}
@media(max-width:560px){.wrap{width:min(var(--max),calc(100% - 24px))}.hero h1{font-size:58px}.hero-stats{gap:24px}.server-card{grid-template-columns:1fr}.server-card>div{border-right:0;border-bottom:1px solid var(--line)}.feature{grid-template-columns:52px 1fr}.feature .arr{display:none}.stat-grid{grid-template-columns:1fr}.crow{grid-template-columns:1fr 100px 1fr}.archive-metrics{grid-template-columns:1fr}.profile-summary{grid-template-columns:1fr}}

/* === FLOATING / COLORED SKYLINE-STYLE PASS === */
body::before{
  content:"";position:fixed;inset:68px 0 auto 0;height:760px;z-index:-2;
  background:
    linear-gradient(180deg,rgba(4,7,12,.32) 0%,rgba(7,9,13,.62) 56%,#090a0e 100%),
    url('vexoria-castle-bg.jpg') center top/cover no-repeat;
  opacity:.88;pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:68px 0 auto 0;height:760px;z-index:-1;
  background:radial-gradient(circle at 50% 28%,rgba(66,135,245,.12),transparent 38%);
  pointer-events:none;
}
.hero{background:transparent!important}
.hero-inner{position:relative}
.logo-stage{filter:drop-shadow(0 14px 42px rgba(0,0,0,.42))}
.server-card{
  position:relative;
  transform:translateY(-14px);
  border:1px solid rgba(77,115,168,.62)!important;
  background:linear-gradient(145deg,rgba(12,18,28,.90),rgba(8,12,19,.84))!important;
  box-shadow:0 24px 68px rgba(0,0,0,.40),0 0 0 1px rgba(66,135,245,.04) inset;
}
.server-card::before{
  content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,#4287f5,#6ecff6,transparent);opacity:.78
}
.ipline{
  width:min(920px,94%);margin:18px auto 0!important;position:relative;transform:translateY(-6px);
  border:1px solid rgba(64,160,214,.48)!important;
  background:linear-gradient(135deg,rgba(10,20,30,.94),rgba(8,13,20,.92))!important;
  box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 30px rgba(110,207,246,.035);
}
.ipline::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(110,207,246,.25),transparent 24%,transparent 76%,rgba(66,135,245,.22));
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px
}
.feature-list{background:transparent!important;border:0!important;gap:12px!important;grid-template-columns:repeat(3,1fr)!important}
.feature{
  min-height:168px;border:1px solid var(--line);padding:25px!important;grid-template-columns:58px 1fr auto!important;
  background:linear-gradient(145deg,rgba(11,15,21,.94),rgba(8,12,18,.94))!important;
  box-shadow:0 18px 55px rgba(0,0,0,.28);transform:translateY(0);transition:.18s ease!important
}
.feature:nth-child(1){border-color:rgba(66,135,245,.62)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(66,135,245,.045)}
.feature:nth-child(2){border-color:rgba(74,204,202,.56)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(74,204,202,.04)}
.feature:nth-child(3){border-color:rgba(164,111,255,.58)!important;box-shadow:0 18px 55px rgba(0,0,0,.28),0 0 35px rgba(164,111,255,.04)}
.feature:nth-child(1) .num,.feature:nth-child(1) .arr{color:#4287f5!important}
.feature:nth-child(2) .num,.feature:nth-child(2) .arr{color:#57d5cf!important}
.feature:nth-child(3) .num,.feature:nth-child(3) .arr{color:#b07cff!important}
.feature:hover{transform:translateY(-6px)!important}
.feature h3{font-size:20px!important}
.section-title{margin-top:18px!important}
.pagehead{position:relative}
.pagehead::after{
  content:"";display:block;width:54px;height:2px;margin:18px auto 0;
  background:linear-gradient(90deg,var(--blue),var(--blue2))
}
.stat-grid{box-shadow:0 18px 54px rgba(0,0,0,.22)}
.panel,.board,.compare-card,.compare-result,.season-card,.match{
  box-shadow:0 15px 45px rgba(0,0,0,.20)
}
.minemen .board{border-color:rgba(66,135,245,.20)}
@media(max-width:900px){.feature-list{grid-template-columns:1fr!important}.server-card{transform:none}.ipline{width:100%;transform:none}}


/* ==============================
   DUELS LEADERBOARDS
   ============================== */
.duels-leaderboards{min-height:760px}
.duel-category-tabs{justify-content:center;margin-bottom:42px}
.duel-category-tabs button{min-width:150px}
.duel-board-heading,.duel-list-title{display:flex;justify-content:space-between;align-items:end;gap:24px}
.duel-board-heading{margin-bottom:28px}
.duel-board-heading h2,.duel-list-title h2{margin:5px 0 0;font-size:30px;letter-spacing:-.04em}
.duel-stat-field{width:230px}
.duel-podium{margin-bottom:58px}
.duel-podium-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}
.duel-podium-card{
  position:relative;min-height:260px;border:1px solid #263247;
  background:linear-gradient(145deg,rgba(14,20,30,.97),rgba(8,12,18,.97));
  padding:29px 22px;text-align:center;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.32)
}
.duel-podium-card::before{
  content:"";position:absolute;left:15%;right:15%;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,#4287f5,#6ecff6,transparent)
}
.duel-podium-card.rank-1{
  min-height:300px;border-color:rgba(66,135,245,.72);transform:translateY(-12px);
  box-shadow:0 24px 70px rgba(0,0,0,.42),0 0 45px rgba(66,135,245,.06)
}
.duel-podium-card.rank-2,.duel-podium-card.rank-3{opacity:.92}
.duel-podium-rank{
  position:absolute;top:15px;left:16px;font-size:11px;font-weight:1000;
  color:#7f8ba0;letter-spacing:.08em
}
.duel-podium-card.rank-1 .duel-podium-rank{color:var(--blue2)}
.duel-podium-head{
  width:88px;height:88px;image-rendering:pixelated;border:1px solid #34435a;
  margin:18px auto 18px
}
.duel-podium-card.rank-1 .duel-podium-head{width:106px;height:106px}
.duel-podium-name{font-size:19px;font-weight:1000}
.duel-podium-stat-label{
  margin-top:22px;color:#6d788a;font-size:9px;font-weight:900;letter-spacing:.14em
}
.duel-podium-value{margin-top:5px;font-size:30px;font-weight:1000;color:#fff}
.duel-podium-card.rank-1 .duel-podium-value{color:var(--blue2);font-size:38px}
.duel-list-title{margin-bottom:15px}
.duels-leaderboards .board{border-color:rgba(66,135,245,.28)}
.duels-leaderboards tbody tr:nth-child(1){background:rgba(66,135,245,.035)}
.duel-stat-active{color:var(--blue2)}
@media(max-width:760px){
  .duel-board-heading{align-items:stretch;flex-direction:column}
  .duel-stat-field{width:100%}
  .duel-podium-grid{grid-template-columns:1fr}
  .duel-podium-card.rank-1{order:-1;transform:none}
  .duel-podium-card{min-height:220px}
}


/* ==============================
   KITPVP SKYLINE-STYLE PROFILE + LEADERBOARD
   ============================== */
.kp-shell{padding:62px 0 78px}
.kp-tabs{display:flex;justify-content:center;gap:22px;border-bottom:1px solid var(--line);margin-bottom:36px}
.kp-tabs button{height:44px;border:0;background:transparent;color:#7f8999;font-size:11px;font-weight:900;border-bottom:2px solid transparent}
.kp-tabs button.active{color:#fff;border-bottom-color:var(--blue)}
.kp-profile-search{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:820px;margin:0 auto 36px}
.kp-hero-card{
  border:1px solid rgba(66,135,245,.48);
  background:linear-gradient(135deg,rgba(21,24,36,.97),rgba(12,14,21,.98));
  padding:44px 46px;display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:34px;
  box-shadow:0 24px 70px rgba(0,0,0,.34),0 0 40px rgba(66,135,245,.04)
}
.kp-hero-head{
  width:150px;height:150px;image-rendering:pixelated;border:1px solid #3b4860;
  padding:8px;background:#151924
}
.kp-hero-meta .kicker{margin-bottom:9px}
.kp-hero-meta h2{font-size:56px;line-height:1;margin:0 0 14px;letter-spacing:-.06em}
.kp-badges{display:flex;gap:8px;flex-wrap:wrap}
.kp-badge{
  border:1px solid #30405a;background:#121a27;padding:7px 10px;font-size:9px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:#aebad0
}
.kp-badge.primary{border-color:rgba(66,135,245,.55);color:var(--blue2);background:rgba(66,135,245,.08)}
.kp-hero-score{text-align:right;min-width:150px}

<script>

const API={
 network:'/api/network',

 duelsLeaderboard:(version='modern',stat='all')=>`/api/duels/leaderboard?version=${encodeURIComponent(version)}&stat=${encodeURIComponent(stat)}`,
 kpPlayer:u=>`/api/kitpvp/player?username=${encodeURIComponent(u)}`,
 kpLeaderboard:(stat='all')=>`/api/kitpvp/leaderboard?stat=${encodeURIComponent(stat)}`,

};
const $=q=>document.querySelector(q), app=()=>$('#app');
function go(h){location.hash=h}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function n(v){return Number(v||0).toLocaleString()}
function pct(v){return `${Number(v||0).toFixed(1)}%`}
function head(u,s=31){return `https://mc-heads.net/avatar/${encodeURIComponent(u)}/${s}`}
async function get(url){const r=await fetch(url);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function copyIP(){navigator.clipboard?.writeText(IP);alert('Copied: '+IP)}
function active(r){document.querySelectorAll('.gnav button[data-r]').forEach(b=>b.classList.toggle('active',b.dataset.r===r))}
function stat(l,v){return `<div class="stat"><label>${l}</label><strong>${v}</strong></div>`}
function row(a,b){return `<div class="row"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`}

 const t=[['home','Home'],['stats','Stats'],['rankings','Leaderboards'],['compare','Compare'],['matches','Recaps'],['rules','Rules']];

}
function feat(no,t,d,h){return `<div class="feature" onclick="go('${h}')"><div class="num">${no}</div><div><h3>${t}</h3><p>${d}</p></div><div class="arr">↗</div></div>`}

 Promise.allSettled([get(API.rbwSummary()),get(API.network)]).then(([a,b])=>{

['Fraud / Scamming','Tricking another player out of items, currency, or account access.',['7-Day Restriction','30-Day Restriction','Permanent Restriction','—','—','—']],
['Unauthorized Trading','Trading accounts, ranks, or in-game items outside official systems.',['7-Day Account Restriction','14-Day Account Restriction','Permanent Restriction','—','—','—']],
['Evading Punishments','Using alternate accounts to bypass an active ban, mute, or restriction.',['30-Day Restriction','Permanent Restriction','—','—','—','—']],
['Marketplace Fraud','Misrepresenting goods, refusing delivery, or scamming through the in-game shop or trades.',['30-Day Restriction','Permanent Restriction','—','—','—','—']],
['False Reports / Evidence','Submitting fake screenshots, edited videos, or knowingly inaccurate reports.',['30-Day Restriction','Permanent Restriction','—','—','—','—']],
['Payment Fraud','Chargebacks, stolen payment methods, or any fraudulent purchase.',['Permanent Restriction','—','—','—','—','—']]
];
function serverRules(){return `<div class="kicker" style="margin:25px 0 16px">CONDUCT & COMMUNITY</div><div class="server-rule-grid">${ruleCards(CONDUCT_RULES)}</div><div class="kicker" style="margin:42px 0 16px">ACCOUNT & MARKETPLACE</div><div class="server-rule-grid">${ruleCards(MARKET_RULES)}</div>`}
function ruleCards(arr){return arr.map(x=>`<div class="server-rule"><h3>${esc(x[0])}</h3><p class="muted">${esc(x[1])}</p><div class="punish-row">${x[2].map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`).join('')}

/* Duels leaderboards + KITPVP */
let duelCategory='modern';
let duelStat='all';

const DUEL_STATS={
 modern:{
   title:'Modern 1.21',
   subtitle:'StrikePractice',
   defaultStat:'kills',
   stats:[
     {id:'all',label:'All Statistics'},
     {id:'kills',label:'Kills'},
     {id:'deaths',label:'Deaths'}
   ]
 },
 'modern-plus':{
   title:'Modern 1.21+',
   subtitle:'MultiDuels',
   defaultStat:'wins',
   stats:[
     {id:'all',label:'All Statistics'},
     {id:'wins',label:'Wins'},
     {id:'losses',label:'Losses'},
     {id:'kills',label:'Kills'}
   ]
 }
};

function setDuelCategory(category){
 duelCategory=category;
 duelStat='all';
 renderDuels();
}

function setDuelStat(statistic){
 duelStat=statistic;
 loadDuelLeaderboard();
}

function duelStatLabel(statistic){
 return {wins:'WINS',losses:'LOSSES',kills:'KILLS',deaths:'DEATHS'}[statistic]||String(statistic).toUpperCase();
}

function renderDuels(){
 active('duels');
 const cfg=DUEL_STATS[duelCategory];
 app().innerHTML=`<section class="section duels-leaderboards"><div class="wrap">
   <div class="pagehead">
     <div class="kicker">VEXORIA DUELS</div>
     <h1>Duels Leaderboards</h1>
     <p>Competitive statistics across Vexoria's Modern 1.21 and Modern 1.21+ PvP systems.</p>
   </div>

   <div class="category-tabs duel-category-tabs">
     <button class="${duelCategory==='modern'?'active':''}" onclick="setDuelCategory('modern')">Modern 1.21</button>
     <button class="${duelCategory==='modern-plus'?'active':''}" onclick="setDuelCategory('modern-plus')">Modern 1.21+</button>
   </div>

   <div class="duel-board-heading">
     <div>
       <div class="kicker">${esc(cfg.subtitle)}</div>
       <h2>${esc(cfg.title)}</h2>
     </div>
     <div class="field duel-stat-field">
       <label>STATISTIC</label>
       <select id="duel-stat" class="select" onchange="setDuelStat(this.value)">
         ${cfg.stats.map(s=>`<option value="${s.id}" ${s.id===duelStat?'selected':''}>${esc(s.label)}</option>`).join('')}
       </select>
     </div>
   </div>

   <div id="duel-podium" class="duel-podium"><div class="empty">Loading top players…</div></div>

   <div class="duel-list-title">
     <div><div class="kicker">FULL RANKINGS</div><h2>Leaderboard</h2></div>
   </div>
   <div id="dboard" class="empty">Loading leaderboard…</div>
 </div></section>`;
 setTimeout(loadDuelLeaderboard,0);
}

async function loadDuelLeaderboard(){
 const board=$('#dboard'),podium=$('#duel-podium');
 if(!board||!podium)return;

 board.className='empty';
 board.textContent='Loading leaderboard…';
 podium.innerHTML='<div class="empty">Loading top players…</div>';

 try{
   const data=await get(API.duelsLeaderboard(duelCategory,duelStat));
   const rows=data.players||[];

   if(!rows.length){
     podium.innerHTML='<div class="empty">No leaderboard data yet.</div>';
     board.className='empty';
     board.textContent='No leaderboard data yet.';
     return;
   }

   const cfg=DUEL_STATS[duelCategory];
   const rankingStat=duelStat==='all'?cfg.defaultStat:duelStat;

   renderDuelPodium(podium,rows.slice(0,3),rankingStat);
   renderDuelTable(board,rows,duelCategory,duelStat,rankingStat);
 }catch(e){
   podium.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
   board.className='empty';
   board.textContent=e.message;
 }
}

function renderDuelPodium(container,players,rankingStat){
 const byRank={
   1:players.find(x=>Number(x.rank)===1),
   2:players.find(x=>Number(x.rank)===2),
   3:players.find(x=>Number(x.rank)===3)
 };
 const ordered=[byRank[2],byRank[1],byRank[3]].filter(Boolean);

 container.innerHTML=`<div class="duel-podium-grid">${ordered.map(player=>{
   const rank=Number(player.rank);
   return `<div class="duel-podium-card rank-${rank}">
     <div class="duel-podium-rank">#${rank}</div>
     <img class="duel-podium-head" src="${head(player.username,88)}" alt="${esc(player.username)}">
     <div class="duel-podium-name">${esc(player.username)}</div>
     <div class="duel-podium-stat-label">${duelStatLabel(rankingStat)}</div>
     <div class="duel-podium-value">${n(player[rankingStat]||0)}</div>
   </div>`;
 }).join('')}</div>`;
}

function renderDuelTable(container,players,category,statistic,rankingStat){
 const all=statistic==='all';
 let headers='',cells=()=>''; 

 if(category==='modern'){
   if(all){
     headers='<th>KILLS</th><th>DEATHS</th>';
     cells=p=>`<td class="${rankingStat==='kills'?'duel-stat-active':''}"><strong>${n(p.kills)}</strong></td><td>${n(p.deaths)}</td>`;
   }else{
     headers=`<th>${duelStatLabel(statistic)}</th>`;
     cells=p=>`<td class="duel-stat-active"><strong>${n(p[statistic])}</strong></td>`;
   }
 }else{
   if(all){
     headers='<th>WINS</th><th>LOSSES</th><th>KILLS</th>';
     cells=p=>`<td class="${rankingStat==='wins'?'duel-stat-active':''}"><strong>${n(p.wins)}</strong></td><td>${n(p.losses)}</td><td>${n(p.kills)}</td>`;
   }else{
     headers=`<th>${duelStatLabel(statistic)}</th>`;
     cells=p=>`<td class="duel-stat-active"><strong>${n(p[statistic])}</strong></td>`;
   }
 }

 container.className='board';
 container.innerHTML=`<table><thead><tr><th>#</th><th></th><th>PLAYER</th>${headers}</tr></thead>
 <tbody>${players.map(player=>`<tr>
   <td class="rank">#${player.rank}</td>
   <td><img class="head" src="${head(player.username)}" alt="${esc(player.username)}"></td>
   <td><strong>${esc(player.username)}</strong></td>
   ${cells(player)}
 </tr>`).join('')}</tbody></table>`;
}

const KP_LB_STATS={
 all:{label:'ALL STATISTICS',field:'kills'},
 kills:{label:'KILLS',field:'kills'},
 deaths:{label:'DEATHS',field:'deaths'},
 coins:{label:'COINS',field:'coins'},
 experience:{label:'EXPERIENCE',field:'experience'},
 streak:{label:'BEST KILLSTREAK',field:'bestKillstreak'}
};
let kpStat='all';
let kpView='leaderboard';

function setKPView(view){
 kpView=view;
 renderKP();
}

function setKPStat(stat){
 kpStat=stat;
 loadKPLB();
}

function kpStatLabel(stat){
 return {kills:'KILLS',deaths:'DEATHS',coins:'COINS',experience:'EXPERIENCE',streak:'BEST KILLSTREAK'}[stat]||String(stat).toUpperCase();
}

function renderKP(){
 active('kitpvp');

 if(kpView==='profile'){
   app().innerHTML=`<section class="kp-shell"><div class="wrap">
     <div class="pagehead">
       <div class="kicker">VEXORIA KITPVP</div>
       <h1>Player Statistics</h1>
       <p>Search a KITPVP player and view their complete persistent combat record.</p>
     </div>

     <div class="kp-tabs">
       <button onclick="setKPView('leaderboard')">Leaderboards</button>
       <button class="active">Player Statistics</button>
     </div>

     <div class="kp-profile-search">
       <input id="kq" class="input" placeholder="Enter Minecraft username">
       <button class="btn primary" onclick="loadKPProfile()">Search →</button>
     </div>

     <div id="kp-profile-out" class="empty">A KITPVP player profile will appear here.</div>
   </div></section>`;
   return;
 }

 app().innerHTML=`<section class="kp-shell"><div class="wrap">
   <div class="pagehead">
     <div class="kicker">VEXORIA KITPVP</div>
     <h1>KITPVP Leaderboards</h1>
     <p>Persistent KITPVP progression ranked across combat and progression statistics.</p>
   </div>

   <div class="kp-tabs">
     <button class="active">Leaderboards</button>
     <button onclick="setKPView('profile')">Player Statistics</button>
   </div>

   <div class="kp-leader-head">
     <div>
       <div class="kicker">GLOBAL KITPVP</div>
       <h2 style="margin:5px 0 0;font-size:30px;letter-spacing:-.04em">Top Players</h2>
     </div>
     <div class="field kp-stat-field">
       <label>STATISTIC</label>
       <select id="kst" class="select" onchange="setKPStat(this.value)">
         <option value="all" ${kpStat==='all'?'selected':''}>All Statistics</option>
         <option value="kills" ${kpStat==='kills'?'selected':''}>Kills</option>
         <option value="deaths" ${kpStat==='deaths'?'selected':''}>Deaths</option>
         <option value="coins" ${kpStat==='coins'?'selected':''}>Coins</option>
         <option value="experience" ${kpStat==='experience'?'selected':''}>Experience</option>
         <option value="streak" ${kpStat==='streak'?'selected':''}>Best Killstreak</option>
       </select>
     </div>
   </div>

   <div id="kp-podium" class="kp-podium"><div class="empty">Loading top players…</div></div>
   <div id="kb" class="empty">Loading leaderboard…</div>
 </div></section>`;

 setTimeout(loadKPLB,0);
}

async function loadKPLB(){
 const out=$('#kb'),podium=$('#kp-podium');
 if(!out||!podium)return;

 out.className='empty';
 out.textContent='Loading leaderboard…';
 podium.innerHTML='<div class="empty">Loading top players…</div>';

 try{
   const data=await get(API.kpLeaderboard(kpStat));
   const rows=data.players||[];

   if(!rows.length){
     podium.innerHTML='<div class="empty">No leaderboard data yet.</div>';
     out.className='empty';
     out.textContent='No leaderboard data yet.';
     return;
   }

   const rankingStat=kpStat==='all'?'kills':kpStat;
   renderKPPodium(podium,rows.slice(0,3),rankingStat);
   renderKPTable(out,rows,kpStat);
 }catch(e){
   podium.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
   out.className='empty';
   out.textContent=e.message;
 }
}

function renderKPPodium(container,players,rankingStat){
 const byRank={
   1:players.find(x=>Number(x.position)===1),
   2:players.find(x=>Number(x.position)===2),
   3:players.find(x=>Number(x.position)===3)
 };
 const ordered=[byRank[2],byRank[1],byRank[3]].filter(Boolean);

 container.innerHTML=`<div class="kp-podium-grid">${ordered.map(player=>{
   const rank=Number(player.position);
   return `<div class="kp-podium-card rank-${rank}">
     <div class="kp-podium-rank">#${rank}</div>
     <img class="kp-podium-head" src="${head(player.username,88)}" alt="${esc(player.username)}">
     <div class="kp-podium-name">${esc(player.username)}</div>
     <div class="kp-podium-label">${kpStatLabel(rankingStat)}</div>
     <div class="kp-podium-value">${n(player[rankingStat]||0)}</div>
   </div>`;
 }).join('')}</div>`;
}

function renderKPTable(container,players,statistic){
 const all=statistic==='all';
 let headers='',cells=()=>''; 

 if(all){
   headers='<th>KILLS</th><th>DEATHS</th><th>COINS</th><th>EXPERIENCE</th><th>BEST STREAK</th>';
   cells=p=>`<td><strong>${n(p.kills)}</strong></td><td>${n(p.deaths)}</td><td>${n(p.coins)}</td><td>${n(p.experience)}</td><td>${n(p.bestKillstreak)}</td>`;
 }else{
   headers=`<th>${kpStatLabel(statistic)}</th>`;
   cells=p=>`<td><strong>${n(p[statistic])}</strong></td>`;
 }

 container.className='board';
 container.innerHTML=`<table><thead><tr><th>#</th><th></th><th>PLAYER</th>${headers}</tr></thead>
 <tbody>${players.map(player=>`<tr>
   <td class="rank">#${player.position}</td>
   <td><img class="head" src="${head(player.username)}" alt="${esc(player.username)}"></td>
   <td><strong>${esc(player.username)}</strong></td>
   ${cells(player)}
 </tr>`).join('')}</tbody></table>`;
}

async function loadKPProfile(name){
 const q=(name||$('#kq')?.value||'').trim();
 if(!q)return;

 const out=$('#kp-profile-out');
 out.className='empty';
 out.textContent='Loading player statistics…';

 try{
   const [x,k,h,lb]=await Promise.all([
     get(API.kpPlayer(q)),
     get(API.kpKits(q)).catch(()=>({ownedKits:[]})),
     get(API.kpKills(q)).catch(()=>({kills:[]})),
     get(API.kpLeaderboard('kills')).catch(()=>({players:[]}))
   ]);

   const rankRow=(lb.players||[]).find(p=>String(p.uuid)===String(x.uuid)||String(p.username).toLowerCase()===String(x.username).toLowerCase());
   const rank=rankRow?.position??'—';
   const kd=Number(x.deaths||0)>0?Number(x.kills||0)/Number(x.deaths||0):Number(x.kills||0);
   const progress=Math.min(100,Math.max(0,Number(x.bestKillstreak||0)*5));

   out.className='';
   out.innerHTML=`<div class="kp-hero-card">
     <img class="kp-hero-head" src="${head(x.username,150)}" alt="${esc(x.username)}">
     <div class="kp-hero-meta">
       <div class="kicker">VEXORIA KITPVP COMPETITOR</div>
       <h2>${esc(x.username)}</h2>
       <div class="kp-badges">
         <span class="kp-badge primary">#${rank} KILLS</span>
         <span class="kp-badge">${esc(x.selectedKit||'No Selected Kit')}</span>
       </div>
     </div>
     <div class="kp-hero-score">
       <label>COINS</label>
       <strong>${n(x.coins)}</strong>
       <span>KITPVP BALANCE</span>
     </div>
   </div>

   <div class="kp-stat-strip">
     <div><label>KILLS</label><strong>${n(x.kills)}</strong></div>
     <div><label>DEATHS</label><strong>${n(x.deaths)}</strong></div>
     <div><label>K/D</label><strong>${Number(kd).toFixed(2)}</strong></div>
     <div><label>CURRENT STREAK</label><strong>${n(x.currentKillstreak)}</strong></div>
     <div><label>BEST STREAK</label><strong>${n(x.bestKillstreak)}</strong></div>
     <div><label>EXPERIENCE</label><strong>${n(x.experience)}</strong></div>
   </div>

   <div class="kp-performance">
     <div class="kp-performance-main">
       <div class="kicker">CAREER OVERVIEW</div>
       <h2 style="margin:8px 0 0;font-size:28px">Performance</h2>
       <div class="kp-performance-grid">
         <div><label>KILLS</label><strong>${n(x.kills)}</strong></div>
         <div><label>DEATHS</label><strong>${n(x.deaths)}</strong></div>
         <div><label>COINS</label><strong>${n(x.coins)}</strong></div>
         <div><label>EXPERIENCE</label><strong>${n(x.experience)}</strong></div>
         <div><label>OWNED KITS</label><strong>${n(k.ownedKitCount||k.ownedKits?.length||0)}</strong></div>
         <div><label>SELECTED KIT</label><strong style="font-size:16px">${esc(x.selectedKit||'None')}</strong></div>
       </div>
     </div>

     <div class="kp-record">
       <div class="kicker">CAREER RECORD</div>
       <strong>${n(x.bestKillstreak)}</strong>
       <div class="muted">BEST KILLSTREAK</div>
       <div class="kp-record-line"><span style="width:${progress}%"></span></div>
       <div class="muted">${n(x.currentKillstreak)} current streak · ${n(x.kills)} total kills</div>
     </div>
   </div>

   <div class="two" style="margin-top:18px">
     <div class="panel">
       <div class="kicker">OWNED KITS</div>
       <h3>${n(k.ownedKitCount||k.ownedKits?.length||0)} unlocked</h3>
       ${(k.ownedKits||[]).slice(0,30).map(z=>`<span class="live" style="margin:3px">${esc(z)}</span>`).join('')||'<div class="muted">No kit data.</div>'}
     </div>
     <div class="panel">
       <div class="kicker">RECENT COMBAT</div>
       <h3>Latest kills</h3>
       ${(h.kills||[]).slice(0,8).map(z=>row(`${z.killer?.username||x.username} → ${z.victim?.username||'Unknown'}`,z.kit||'KITPVP')).join('')||'<div class="muted">No recent kill history.</div>'}
     </div>
   </div>`;
 }catch(e){
   out.className='empty';
   out.textContent=e.message;
 }
}

function router(){const h=(location.hash||'#home').slice(1);if(h==='home')return renderHome();if(h==='rbw-home')return renderRBWHome();if(h==='rbw-stats')return renderStats();if(h==='rbw-rankings')return renderRankings();if(h==='rbw-compare')return renderCompare();if(h==='rbw-matches')return renderMatches();if(h==='rbw-rules')return renderRules();if(h==='duels')return renderDuels();if(h==='kitpvp')return renderKP();if(h.startsWith('kitpvp-player/')){kpView='profile';renderKP();setTimeout(()=>{const u=decodeURIComponent(h.slice(14));if($('#kq'))$('#kq').value=u;loadKPProfile(u)},60);return;}return renderHome()}
addEventListener('hashchange',router);router();
</script>
